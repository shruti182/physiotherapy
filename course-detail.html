<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Details — Learners Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ── HERO ── */
  .course-hero{
    background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    color:#fff;padding:4rem 2rem;margin-bottom:3rem;
  }
  .course-hero__content{max-width:1200px;margin:0 auto;}
  .course-hero__label{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;opacity:.9;margin-bottom:.5rem;}
  .course-hero__title{font-size:2.5rem;font-weight:800;margin-bottom:.5rem;font-family:var(--display);}
  .course-hero__subtitle{font-size:1.1rem;color:#fff;opacity:1;margin-bottom:1.5rem;text-shadow:0 1px 4px rgba(0,0,0,.25);}
  .course-hero__meta{display:flex;flex-wrap:wrap;gap:2rem;font-size:.95rem;}
  .course-hero__meta-item{display:flex;align-items:center;gap:.5rem;}

  /* ── LAYOUT ── */
  .course-container{max-width:1200px;margin:0 auto;padding:0 2rem 4rem;}
  .course-grid{display:grid;grid-template-columns:1fr 320px;gap:2rem;margin-top:2rem;}
  .course-main{}
  .course-sidebar{display:flex;flex-direction:column;gap:1.5rem;}

  /* ── SYLLABUS ── */
  .syllabus-section{
    background:#fff;border:2px solid var(--line);border-radius:var(--radius-sm);
    padding:2rem;margin-bottom:2rem;
  }
  .syllabus-section h3{font-family:var(--display);font-size:1.25rem;font-weight:700;color:var(--ink);margin-bottom:1.5rem;}
  .syllabus-status{
    padding:1rem;background:var(--light-bg);border-radius:var(--radius-sm);
    border-left:4px solid var(--purple);color:var(--text);font-size:.95rem;margin-bottom:1rem;
  }
  .syllabus-download{
    display:flex;align-items:center;gap:1rem;padding:1.25rem;
    background:var(--light-bg);border:2px solid var(--line);border-radius:var(--radius-sm);
    text-decoration:none;color:var(--ink);transition:all .2s ease;margin-bottom:.75rem;
  }
  .syllabus-download:last-of-type{margin-bottom:0;}
  .syllabus-download:hover{border-color:var(--purple);background:#f9f3ff;}
  .syllabus-download__icon{font-size:1.5rem;flex-shrink:0;}
  .syllabus-download__info{flex:1;}
  .syllabus-download__name{font-weight:600;color:var(--ink);}
  .syllabus-download__size{font-size:.8rem;color:var(--text-soft);}
  .syllabus-empty{padding:2rem;text-align:center;color:var(--text-soft);}

  /* ── TEST CARDS ── */
  .tests-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap:14px;
  }
  .test-card{
    display:flex;flex-direction:column;
    padding:18px;background:#fff;
    border:1.5px solid var(--line,#e2e8f0);border-radius:12px;
    transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .test-card:hover{
    border-color:var(--purple,#764ba2);
    box-shadow:0 6px 18px rgba(118,75,162,.14);
    transform:translateY(-2px);
  }
  .test-card__type{
    display:inline-block;align-self:flex-start;
    font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--purple,#764ba2);background:#f3ecfb;
    padding:3px 9px;border-radius:20px;margin-bottom:10px;
  }
  .test-card__title{font-weight:700;color:var(--ink,#0f2a4a);margin-bottom:4px;font-size:1rem;line-height:1.3;}
  .test-card__meta{font-size:.78rem;color:var(--text-soft,#64748b);margin-bottom:10px;}
  .test-card__desc{font-size:.82rem;color:#475569;margin:0 0 12px 0;line-height:1.4;}
  .test-card__btn{
    display:block;width:100%;text-align:center;padding:10px;margin-top:auto;
    background:var(--purple,#764ba2);color:#fff;border:none;border-radius:7px;
    font-weight:600;font-size:.85rem;cursor:pointer;transition:background .2s;
  }
  .test-card__btn:hover{background:#5a3580;}

  /* ── VIDEOS ── */
  .videos-section{
    background:#fff;border:2px solid var(--line);border-radius:var(--radius-sm);padding:2rem;
  }
  .videos-section h3{font-family:var(--display);font-size:1.25rem;font-weight:700;color:var(--ink);margin-bottom:1.5rem;}
  .video-list{display:flex;flex-direction:column;gap:1rem;}
  .video-item{
    display:flex;align-items:flex-start;gap:1rem;padding:1rem;
    background:var(--light-bg);border-radius:var(--radius-sm);
    cursor:pointer;transition:all .2s ease;border:1px solid transparent;
  }
  .video-item:hover{background:#f9f3ff;border-color:var(--purple);}
  .video-item__number{
    flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;
    justify-content:center;background:var(--purple);color:#fff;border-radius:50%;
    font-weight:700;font-size:.85rem;
  }
  .video-item__content{flex:1;min-width:0;}
  .video-item__title{font-weight:600;color:var(--ink);margin-bottom:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .video-item__meta{font-size:.8rem;color:var(--text-soft);}
  .video-item__play{flex-shrink:0;font-size:1.25rem;color:var(--purple);}
  .videos-empty{padding:2rem;text-align:center;color:var(--text-soft);}

  /* ── SIDEBAR ── */
  .course-info-card{background:#fff;border:2px solid var(--line);border-radius:var(--radius-sm);padding:1.5rem;}
  .course-info-card h4{font-weight:700;font-size:.9rem;text-transform:uppercase;color:var(--text-soft);letter-spacing:.05em;margin-bottom:1rem;}
  .course-info-item{display:flex;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--line);font-size:.9rem;}
  .course-info-item:last-child{border-bottom:none;}
  .course-info-label{color:var(--text-soft);}
  .course-info-value{font-weight:600;color:var(--ink);}
  .cta-button{
    width:100%;padding:1rem;background:var(--accent);color:#fff;border:none;
    border-radius:var(--radius-sm);font-weight:700;font-size:1rem;cursor:pointer;transition:all .2s ease;
  }
  .cta-button:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(245,158,11,.3);}
  .loading{display:flex;align-items:center;justify-content:center;padding:2rem;color:var(--text-soft);}

  /* ── TEST MODAL ── */
  .test-modal-backdrop{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
    z-index:1000;align-items:center;justify-content:center;
  }
  .test-modal-backdrop.open{display:flex;}
  .test-modal-box{
    background:#fff;border-radius:12px;width:96vw;height:92vh;max-width:1100px;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .test-modal-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 20px;border-bottom:1px solid #e2e8f0;flex-shrink:0;background:#fff;
  }
  .test-modal-header h3{font-size:16px;font-weight:700;color:#0f2a4a;margin:0;}
  .test-modal-close{
    background:none;border:none;font-size:22px;cursor:pointer;
    color:#64748b;line-height:1;padding:6px 10px;border-radius:6px;transition:.15s;
  }
  .test-modal-close:hover{background:#f1f5f9;color:#0f2a4a;}
  .test-modal-iframe{flex:1;border:none;width:100%;}

  /* ── RESPONSIVE ── */
  @media(max-width:768px){
    .course-grid{grid-template-columns:1fr;}
    .course-hero__title{font-size:1.75rem;}
    .course-hero{padding:2rem 1rem;}
    .course-container{padding:0 1rem 2rem;}
  }
</style>
</head>

<main>

  <!-- ── HERO ── -->
  <div class="course-hero">
    <div class="course-hero__content">
      <div class="course-hero__label" id="courseLabel">Loading…</div>
      <h1 class="course-hero__title" id="courseTitle">Loading…</h1>

      <div class="course-hero__meta">
        <div class="course-hero__meta-item"><span>⏱</span><span id="courseMeta1">—</span></div>
        <div class="course-hero__meta-item"><span>▤</span><span id="courseMeta2">—</span></div>

<script type="module">
import { supabase } from "./supabase-client.js";

const params   = new URLSearchParams(window.location.search);
const courseId = params.get("course");

if (!courseId) {
  document.querySelector(".course-hero__content").innerHTML = `
    <div style="text-align:center;color:#fff">
      <h2>Course not found</h2>
      <p><a href="courses.html" style="color:#fff;text-decoration:underline">← Back to Courses</a></p>
    </div>`;
} else {
  loadCourseDetails();
}

/* ══════════════ COURSE DETAILS ══════════════ */
async function loadCourseDetails() {
  try {
    const parts = courseId.split("-grade-");
    if (parts.length !== 2) { showError("Invalid course format"); return; }
    const [subject, grade] = parts;

    const subjectData = {
      "math": {
        name:"Mathematics", label:"Mathematics · CBSE & ICSE",
        desc: g=>`Numbers, algebra, geometry, and problem-solving — complete syllabus-aligned mathematics for Class ${g}, with board exam prep built in.`,
        instructor:"Dr. Priya Sharma", rating:"4.8", reviews:"1,920",
        hours:"80 hours", lessons:"200 lessons", students:"14K"
      },
      "science": {
        name:"Science", label:"Science · CBSE & ICSE",
        desc: g=>`Physics, Chemistry, and Biology through animated experiments and interactive quizzes for Class ${g}.`,
        instructor:"Prof. Rajesh Kumar", rating:"4.7", reviews:"1,610",
        hours:"72 hours", lessons:"180 lessons", students:"11K"
      },
      "english": {
        name:"English", label:"English · CBSE & ICSE",
        desc: g=>`Grammar, literature, writing, and comprehension — interactive drills and board-exam essay frameworks for Class ${g}.`,
        instructor:"Ms. Ananya Rao", rating:"4.8", reviews:"1,152",
        hours:"54 hours", lessons:"105 lessons", students:"6.1K"
      },
      "social-studies": {
        name:"Social Science", label:"Social Science · CBSE & ICSE",
        desc: g=>`History, Geography, Civics, and Economics for Class ${g} — board-aligned with map work and source-based questions.`,
        instructor:"Mr. Arun Mehta", rating:"4.6", reviews:"980",
        hours:"60 hours", lessons:"150 lessons", students:"8K"
      },
      "computers": {
        name:"Computers", label:"Computers · CBSE",
        desc: g=>`Programming basics, MS Office, and digital literacy for Class ${g} students.`,
        instructor:"Ms. Shrutika Khandelwal", rating:"4.9", reviews:"540",
        hours:"40 hours", lessons:"80 lessons", students:"3K"
      }
    };

    const data = subjectData[subject];
    if (!data) { showError("Subject not found"); return; }

    // Monthly subscription pricing (matches pricing.html): Grade 6–9 vs 10–12, per subject
    const gradeNum = parseInt(grade, 10);
    data.price = (gradeNum >= 10 ? "₹10,000" : "₹6,000") + "/month";

    document.getElementById("courseLabel").textContent      = data.label;
    document.getElementById("courseTitle").textContent      = `${data.name} — Class ${grade}`;
    document.getElementById("courseSubtitle").textContent   = data.desc(grade);
    document.getElementById("courseMeta1").textContent      = data.hours;
    document.getElementById("courseMeta2").textContent      = data.lessons;
    document.getElementById("courseMeta3").textContent      = data.students;
    document.getElementById("courseInstructor").textContent = data.instructor;
    document.getElementById("courseRating").textContent     = `${data.rating} (${data.reviews})`;
    document.getElementById("coursePrice").textContent      = data.price;

    // Load all three sections in parallel
    await Promise.all([
      loadSyllabus(courseId),
      loadTests(courseId, subject, grade),
      loadVideos(courseId)
    ]);

  } catch (err) {
    showError(err.message);
  }
}

/* ══════════════ SYLLABUS ══════════════ */
async function loadSyllabus(courseId) {
  const container = document.getElementById("syllabusContent");
  try {
    const { data, error } = await supabase
      .from("syllabus")
      .select("id,file_name,file_size,storage_path,file_url,description")
      .eq("course_id", courseId)
      .order("created_at", { ascending: false });

    if (error) throw error;

    if (!data || data.length === 0) {
      container.innerHTML = `<div class="syllabus-empty"><p>📄 No syllabus available yet. Check back soon!</p></div>`;
      return;
    }

    const statusHTML = `<div class="syllabus-status">✅ ${data.length} syllabus file(s) available for download</div>`;
    const syllabusHTML = data.map(s => {
      let url = s.file_url;
      if (!url && s.storage_path) {
        const { data: u } = supabase.storage.from("syllabus").getPublicUrl(s.storage_path);
        url = u.publicUrl;
      }
      const sizeMB = s.file_size ? (s.file_size / 1024 / 1024).toFixed(1) : "—";
      const label  = s.description || s.file_name;
      return `
        <a href="${url}" download class="syllabus-download" target="_blank">
          <div class="syllabus-download__icon">📥</div>
          <div class="syllabus-download__info">
            <div class="syllabus-download__name">${escapeHtml(label)}</div>
            <div class="syllabus-download__size">${sizeMB} MB</div>
          </div>
        </a>`;
    }).join("");

    container.innerHTML = statusHTML + syllabusHTML;
  } catch (err) {
    container.innerHTML = `<div class="syllabus-empty"><p>⚠️ Could not load syllabus.</p></div>`;
    console.error("Syllabus error:", err);
  }
}

/* ══════════════ TESTS ══════════════ */
async function loadTests(courseId, subject, grade) {
  const container = document.getElementById("testsContent");
  if (!container) return;
  container.classList.remove("loading");

  try {
    const { data, error } = await supabase
      .from("tests")
      .select("id,title,test_type,total_questions,duration_min,storage_path,file_url,description,status,is_active")
      .eq("status", "published")
      .eq("is_active", true)
      .eq("subject", subject)
      .eq("grade", grade)
      .order("created_at", { ascending: false });

    if (error) throw error;

    if (!data || data.length === 0) {
      container.innerHTML = `<div class="syllabus-empty"><p>📝 No tests published for Class ${escapeHtml(grade)} yet.</p></div>`;
      return;
    }

    const cards = data.map(test => {
      // Use file_url stored in DB first; fall back to generating from storage_path
      let publicUrl = test.file_url;
      if (!publicUrl && test.storage_path) {
        const { data: u } = supabase.storage.from("tests").getPublicUrl(test.storage_path);
        publicUrl = u?.publicUrl || "#";
      }

      const typeLabel = test.test_type ? test.test_type.toUpperCase() : "TEST";
      const meta = [
        test.total_questions? `${test.total_questions} Qs`    : null,
        test.duration_min   ? `${test.duration_min} min`      : null
      ].filter(Boolean).join(" · ");

      const safeUrl   = (publicUrl || "#").replace(/'/g, "\\'");
      const safeTitle = escapeHtml(test.title).replace(/'/g, "&#39;");

      return `
        <div class="test-card">
          <span class="test-card__type">${escapeHtml(typeLabel)}</span>
          <div class="test-card__title">${escapeHtml(test.title)}</div>
          ${meta ? `<div class="test-card__meta">${escapeHtml(meta)}</div>` : ""}
          ${test.description ? `<p class="test-card__desc">${escapeHtml(test.description)}</p>` : ""}
          <button class="test-card__btn" onclick="openTestModal('${safeUrl}','${safeTitle}','${test.id}')">
            ▶ Take Test
          </button>
        </div>`;
    }).join("");

    container.innerHTML = `<div class="tests-grid">${cards}</div>`;

  } catch (err) {
    container.innerHTML = `<div class="syllabus-empty"><p>⚠️ Could not load tests.</p></div>`;
    console.error("Tests error:", err);
  }
}

/* ══════════════ VIDEOS ══════════════ */
async function loadVideos(courseId) {
  const container = document.getElementById("videosContent");
  try {
    const { data, error } = await supabase
      .from("videos")
      .select("id,title,video_url,thumb_url,uploaded_at")
      .eq("course_id", courseId)
      .order("uploaded_at", { ascending: true });

    if (error) throw error;

    if (!data || data.length === 0) {
      container.innerHTML = `<div class="videos-empty"><p>▶ No videos available yet. Check back soon!</p></div>`;
      return;
    }

    container.innerHTML = `
      <div class="video-list">
        ${data.map((v, i) => `
          <div class="video-item" onclick="playVideo('${escapeHtml(v.id)}','${escapeHtml(v.video_url || '')}')">
            <div class="video-item__number">${i + 1}</div>
            <div class="video-item__content">
              <div class="video-item__title">${escapeHtml(v.title)}</div>
              <div class="video-item__meta">Video Lesson</div>
            </div>
            <div class="video-item__play">▶</div>
          </div>`).join("")}
      </div>`;
  } catch (err) {
    container.innerHTML = `<div class="videos-empty"><p>⚠️ Could not load videos.</p></div>`;
    console.error("Videos error:", err);
  }
}

/* ══════════════ TEST MODAL ══════════════ */
async function openTestModal(url, title, testId) {
  const modal  = document.getElementById("testModal");
  const iframe = document.getElementById("testModalIframe");
  const header = document.getElementById("testModalTitle");

  header.textContent   = title || "Practice Test";
  iframe.src           = "";
  iframe.srcdoc        = "<div style='padding:2rem;font-family:sans-serif;color:#555'>Loading test…</div>";
  modal.classList.add("open");
  document.body.style.overflow = "hidden";

  try {
    // Fetch the HTML file and write it directly to srcdoc to avoid CORS
    const res  = await fetch(url);
    let html = await res.text();

    // Inject the test's database ID into the iframe so the quiz can report it
    // back via postMessage when it grades itself. Placed right after <head>
    // (or at the very top if no <head> tag exists) so it's defined before
    // any of the quiz's own scripts run.
    const idScript = `<script>window.PARENT_TEST_ID = ${JSON.stringify(testId || "")};<\/script>`;
    if (/<head[^>]*>/i.test(html)) {
      html = html.replace(/<head[^>]*>/i, match => match + idScript);
    } else {
      html = idScript + html;
    }

    // Write HTML directly to iframe using srcdoc - this avoids CORS issues
    iframe.srcdoc = html;
  } catch (err) {
    iframe.srcdoc = `<div style="padding:2rem;font-family:sans-serif;color:#dc2626">
      ⚠️ Could not load test. <a href="${url}" target="_blank">Open in new tab</a></div>`;
    console.error("Test load error:", err);
  }
}

function closeTestModal() {
  document.getElementById("testModal").classList.remove("open");
  document.getElementById("testModalIframe").src    = "";
  document.getElementById("testModalIframe").srcdoc = "";
  document.body.style.overflow = "";
}

// Close on backdrop click
document.getElementById("testModal").addEventListener("click", function(e) {
  if (e.target === this) closeTestModal();
});

// Close on Escape key
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeTestModal();
});

// ── Listen for test completion from iframe ──
window.addEventListener("message", async (event) => {
  const d = event.data;
  // Expected format: { type: "TEST_COMPLETE", testId, score, totalMarks, answers: [{question, student_answer, correct_answer, is_correct, marks_for_q}] }
  if (!d || d.type !== "TEST_COMPLETE") return;

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { console.warn("No session — test score not saved"); return; }

  const percentage = d.totalMarks > 0 ? ((d.score / d.totalMarks) * 100).toFixed(2) : 0;

  const { error } = await supabase.from("test_attempts").insert({
    test_id:     d.testId,
    student_id:  session.user.id,
    score:        d.score ?? 0,
    total_marks:  d.totalMarks ?? 0,
    percentage:   parseFloat(percentage),
    answers:      d.answers ?? [],   // full answer array stored as JSONB
  });

  if (error) {
    console.error("Failed to save test attempt:", error.message);
  } else {
    console.log("✓ Test attempt saved to Supabase");
    // Optionally show a toast if the function exists in this scope
    const toastEl = document.createElement("div");
    toastEl.style.cssText = "position:fixed;bottom:2rem;right:2rem;background:#10b981;color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;z-index:9999;font-size:14px";
    toastEl.textContent = `✓ Test submitted! Score: ${d.score}/${d.totalMarks} (${percentage}%)`;
    document.body.appendChild(toastEl);
    setTimeout(() => toastEl.remove(), 4000);
  }
});

/* ══════════════ HELPERS ══════════════ */
function playVideo(videoId, videoUrl) {
  if (videoUrl) window.open(videoUrl, "_blank");
  else alert("Video player coming soon: " + videoId);
}

function addToCart() {
  if (!courseId) return;
  alert("Add to cart: " + courseId);
  // TODO: Razorpay integration
}

function showError(msg) {
  console.error("Course error:", msg);
  document.querySelector(".course-hero").innerHTML = `
    <div style="max-width:600px;margin:0 auto;text-align:center;padding:4rem 1rem">
      <div style="font-size:4rem;margin-bottom:1rem">📚</div>
      <h2 style="color:#fff;font-family:var(--display);font-size:2rem;margin-bottom:.75rem">Course not found</h2>
      <p style="color:rgba(255,255,255,.85);font-size:1.05rem;margin-bottom:2rem">We couldn't find this course. It may have moved or the link may be incorrect.</p>
      <a href="courses.html" style="display:inline-block;background:#fff;color:#764ba2;font-weight:700;padding:14px 32px;border-radius:999px;text-decoration:none;font-size:1rem;">Browse all courses →</a>
    </div>`;
  document.querySelector(".course-container").style.display = "none";
}

function escapeHtml(text) {
  if (!text) return "";
  const d = document.createElement("div");
  d.textContent = String(text);
  return d.innerHTML;
}
